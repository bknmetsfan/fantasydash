# fly launch --copy-config --no-deploy   (then set secrets, create volume, deploy)
app = "fantasydash"
primary_region = "ewr"

[build]

[env]
  DATA_DIR = "/data"
  TZ = "America/New_York"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"      # sleep when idle; the game-window cron in
  auto_start_machines = true       # .github/workflows/tick.yml keeps it awake
  min_machines_running = 0         # (and logging) while games are on

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[mounts]
  source = "blotter_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
